<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Gabriel Ayoyemi Favour – Product Designer</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter+Tight:wght@400;500;700&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#FAF9F6;--ink:#14110F;--muted:#6F6A64;--line:#D9D3CB;--tray:#F1EDE6;
  --yel:#F5C96A;--coral:#E5392B;--sky:#7CC6E8;--lil:#B9A7FF;
  box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#15120F;--ink:#F4EFE8;--muted:#A39C93;--line:#3A352F;--tray:#1E1A16;--coral:#FF6A5C}}
:root[data-theme="dark"]{--bg:#15120F;--ink:#F4EFE8;--muted:#A39C93;--line:#3A352F;--tray:#1E1A16;--coral:#FF6A5C}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"Inter Tight",system-ui,-apple-system,"Segoe UI",sans-serif;min-height:100vh;-webkit-font-smoothing:antialiased}
.wrap{max-width:1180px;margin:0 auto;padding:24px clamp(20px,5vw,56px) 40px;display:grid;grid-template-rows:auto 1fr;min-height:100vh}
header{font-weight:500;color:var(--muted);letter-spacing:-.01em}
main{display:grid;gap:32px;align-items:center;grid-template-columns:1fr;padding-top:20px}
@media(min-width:820px){main{grid-template-columns:1.05fr .95fr}}
.steps{display:flex;align-items:center;gap:10px;margin:0 0 26px;padding:0;list-style:none;font-size:.85rem;color:var(--muted);flex-wrap:wrap}
.steps li{display:flex;align-items:center;gap:8px}
.steps i{width:10px;height:10px;border-radius:50%;background:var(--yel)}
.steps li.now{color:var(--ink)}
.steps li.now i{background:var(--coral);animation:pulse 1.6s ease-in-out infinite}
.steps b{width:28px;border-top:1.5px dashed var(--line)}
@keyframes pulse{50%{box-shadow:0 0 0 6px color-mix(in srgb,var(--coral) 22%,transparent)}}
h1{font-size:clamp(3.2rem,11vw,7rem);line-height:.92;letter-spacing:-.055em;font-weight:700;margin:0 0 22px}
p.lead{font-size:1.1rem;line-height:1.55;color:var(--muted);max-width:40ch;margin:0 0 28px}
.actions{display:flex;flex-wrap:wrap;gap:10px}
a.btn{display:inline-flex;align-items:center;min-height:44px;padding:0 20px;border-radius:10px;font:500 .95rem "Inter Tight",system-ui,sans-serif;text-decoration:none;color:var(--ink);border:1.5px solid var(--line)}
a.btn.primary{background:var(--yel);color:#14110F;border-color:transparent}
a.btn:focus-visible{outline:3px solid var(--sky);outline-offset:3px}
.play{position:relative;width:100%;height:min(56vh,480px);min-height:340px;border-radius:28px;background:var(--tray);overflow:hidden;touch-action:none;user-select:none;-webkit-user-select:none}
.sh{position:absolute;left:0;top:0;display:grid;place-items:center;font-weight:700;letter-spacing:-.04em;color:#14110F;cursor:grab;will-change:transform}
.sh:active{cursor:grabbing}
.hint{position:absolute;left:0;right:0;top:14px;text-align:center;font-size:.85rem;color:var(--muted);pointer-events:none}
@media(prefers-reduced-motion:reduce){.steps li.now i{animation:none}}
</style>
</head>
<body>
<div class="wrap">
  <header>Product designer</header>
  <main>
    <section>
      <ol class="steps" aria-label="Portfolio progress">
        <li><i></i>Research</li><b></b>
        <li><i></i>Design</li><b></b>
        <li class="now"><i></i>Launch</li>
      </ol>
      <h1>Gabriel<br>Ayoyemi<br>Favour</h1>
      <p class="lead">This space is getting a little makeover. Check back soon.</p>
      <div class="actions">
        <a class="btn primary" href="mailto:gabrielayoyemifavour@gmail.com">Email me</a>
        <a class="btn" href="https://www.linkedin.com/in/ayoyemi-gabriel-840377362">LinkedIn</a>
      </div>
    </section>
    <section>
      <div class="play" id="p" role="img" aria-label="Playful coloured shapes you can drag and toss around"><div class="hint">Drag and toss</div></div>
    </section>
  </main>
</div>
<script>
(function(){
  var box=document.getElementById('p'),W=0,H=0,items=[],drag=null,last=0,calm=matchMedia('(prefers-reduced-motion:reduce)').matches;
  var defs=[
    {r:52,c:'var(--yel)',t:'G',br:'50%'},
    {r:46,c:'var(--coral)',t:'A',br:'50%'},
    {r:44,c:'var(--sky)',t:'F',br:'28%'},
    {r:36,c:'var(--lil)',t:'',br:'30%'},
    {r:30,c:'var(--ink)',t:'',br:'50%'},
    {r:40,c:'transparent',t:'',br:'50%',ring:1}
  ];
  function size(){var b=box.getBoundingClientRect();W=b.width;H=b.height}
  size();
  defs.forEach(function(d,i){
    var e=document.createElement('div');e.className='sh';
    e.style.width=e.style.height=d.r*2+'px';e.style.borderRadius=d.br;e.style.background=d.c;e.style.fontSize=d.r*.9+'px';
    if(d.ring){e.style.border='10px solid var(--ink)'}
    e.textContent=d.t;box.appendChild(e);
    var it={el:e,r:d.r,m:d.r*d.r,x:W*(.15+.7*(i/5)),y:calm?H-d.r:-d.r*2-i*70,vx:(Math.random()-.5)*160,vy:0,rot:Math.random()*6,vr:0};
    items.push(it);
    e.addEventListener('pointerdown',function(ev){drag={it:it,dx:0,dy:0,px:ev.clientX,py:ev.clientY,t:performance.now()};var b=box.getBoundingClientRect();drag.dx=it.x-(ev.clientX-b.left);drag.dy=it.y-(ev.clientY-b.top);e.setPointerCapture(ev.pointerId);it.vx=it.vy=0;ev.preventDefault()});
    e.addEventListener('pointermove',function(ev){if(!drag||drag.it!==it)return;var b=box.getBoundingClientRect(),nx=ev.clientX-b.left+drag.dx,ny=ev.clientY-b.top+drag.dy,now=performance.now(),dt=Math.max((now-drag.t)/1000,.008);
      it.vx=.6*it.vx+.4*(nx-it.x)/dt;it.vy=.6*it.vy+.4*(ny-it.y)/dt;it.x=Math.max(it.r,Math.min(W-it.r,nx));it.y=Math.max(it.r,Math.min(H-it.r,ny));drag.t=now});
    function up(){if(drag&&drag.it===it){drag=null;var s=900;it.vx=Math.max(-s,Math.min(s,it.vx));it.vy=Math.max(-s,Math.min(s,it.vy))}}
    e.addEventListener('pointerup',up);e.addEventListener('pointercancel',up)
  });
  window.addEventListener('resize',size);
  function step(dt){
    items.forEach(function(a){
      if(drag&&drag.it===a)return;
      a.vy+=1500*dt;a.x+=a.vx*dt;a.y+=a.vy*dt;
      if(a.x<a.r){a.x=a.r;a.vx=-a.vx*.5}
      if(a.x>W-a.r){a.x=W-a.r;a.vx=-a.vx*.5}
      if(a.y>H-a.r){a.y=H-a.r;a.vy=-a.vy*.45;a.vx*=.985;if(Math.abs(a.vy)<30)a.vy=0}
      a.vr=a.vx/a.r;a.rot+=a.vr*dt
    });
    for(var k=0;k<3;k++)for(var i=0;i<items.length;i++)for(var j=i+1;j<items.length;j++){
      var a=items[i],b=items[j],dx=b.x-a.x,dy=b.y-a.y,d=Math.sqrt(dx*dx+dy*dy)||.01,o=a.r+b.r-d;
      if(o>0){var nx=dx/d,ny=dy/d,ad=drag&&drag.it===a,bd=drag&&drag.it===b,ta=a.m+b.m,wa=bd?1:b.m/ta,wb=ad?1:a.m/ta;
        if(ad)wa=0;if(bd)wb=0;
        a.x-=nx*o*wa;a.y-=ny*o*wa;b.x+=nx*o*wb;b.y+=ny*o*wb;
        var rv=(b.vx-a.vx)*nx+(b.vy-a.vy)*ny;
        if(rv<0){var imp=-(1.4)*rv/(1/a.m+1/b.m);if(!ad){a.vx-=imp*nx/a.m;a.vy-=imp*ny/a.m}if(!bd){b.vx+=imp*nx/b.m;b.vy+=imp*ny/b.m}}}
    }
  }
  function frame(t){
    var dt=Math.min((t-last)/1000||0,.03);last=t;step(dt);
    items.forEach(function(a){a.el.style.transform='translate('+(a.x-a.r)+'px,'+(a.y-a.r)+'px) rotate('+a.rot+'rad)'});
    requestAnimationFrame(frame)
  }
  requestAnimationFrame(frame)
})();
</script>
</body>
</html>
